<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신발 | MOOSIN STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="shoes">
  <header id="header"></header>

  <main class="inner">
    <div class="page-head">
      <h1 id="pageTitle"></h1>
      <p id="pageDesc"></p>
    </div>

    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div>
        <span class="count" id="count"></span>
        <select class="sort" id="sort" aria-label="정렬">
          <option value="rank">무신 추천순</option>
          <option value="sale">할인율순</option>
          <option value="low">낮은 가격순</option>
          <option value="high">높은 가격순</option>
          <option value="rating">평점순</option>
        </select>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
