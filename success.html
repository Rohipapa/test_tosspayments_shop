<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 | MOOSIN STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="result" id="result"></main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    /* ==========================================================
       결제 성공 (successUrl)
       토스페이먼츠가 ?paymentType=&orderId=&paymentKey=&amount= 를 붙여서 리다이렉트합니다.

       여기까지 왔다고 결제가 끝난 게 아닙니다. 10분 안에 서버가 결제 승인 API를 호출해야 확정됩니다.
       Edge Function confirm-payment가 주문 상태·금액을 DB와 비교하고, 재고를 차감한 뒤
       토스 승인 API를 호출합니다. 새로고침해도 한 번만 승인됩니다.
       ========================================================== */
    (async function () {
      const q = new URLSearchParams(location.search);
      const orderId = q.get("orderId");
      const paymentKey = q.get("paymentKey");
      const amount = Number(q.get("amount"));
      const result = $("#result");

      const fail = (title, message) => {
        result.innerHTML = `
          <div class="result__icon result__icon--fail">!</div>
          <h1>${esc(title)}</h1>
          <p>${esc(message)}</p>
          <dl><dt>주문번호</dt><dd>${esc(orderId || "-")}</dd><dt>결제 금액</dt><dd>${amount ? won(amount) : "-"}</dd></dl>
          <div class="btn-row"><a class="btn" href="cart.html">장바구니</a><a class="btn btn--black" href="index.html">홈으로</a></div>`;
      };

      if (!orderId || !paymentKey || !Number.isInteger(amount)) {
        fail("결제 정보를 확인할 수 없어요", "결제 정보가 올바르지 않습니다.");
        return;
      }

      result.innerHTML = `<p class="loading">결제를 승인하고 있어요. 창을 닫지 말고 잠시만 기다려 주세요...</p>`;
      await App.ready;

      // 다른 요청이 처리 중(PROCESSING)이면 잠시 후 다시 확인
      let res;
      for (let attempt = 0; ; attempt++) {
        try {
          res = await callFunction("confirm-payment", { paymentKey, orderId, amount });
          break;
        } catch (err) {
          if (err.code === "PROCESSING" && attempt < 5) {
            await new Promise((r) => setTimeout(r, 1500));
            continue;
          }
          console.error(err);
          fail("결제를 완료하지 못했어요", err.message);
          return;
        }
      }

      const order = res.order;
      const items = order?.order_items || [];

      // 결제할 상품 정보를 정리하고, 비회원 장바구니에서 주문한 상품을 지움 (회원 장바구니는 서버가 지움)
      Checkout.clear();
      if (order?.source === "cart") {
        if (Auth.user) await Cart.load().catch(() => {});
        else {
          const bought = items.map((i) => i.product_id + "|" + i.size);
          await Cart.save(Cart.items().filter((i) => !bought.includes(cartKey(i))));
        }
        updateCartBadge();
      }

      result.innerHTML = `
        <div class="result__icon">✓</div>
        <h1>결제가 완료되었어요</h1>
        <p>주문해 주셔서 감사합니다.</p>
        <dl>
          <dt>주문번호</dt><dd>${esc(order.id)}</dd>
          <dt>주문 상품</dt><dd>${esc(order.order_name)}</dd>
          <dt>결제 금액</dt><dd>${won(order.total_amount)}</dd>
          <dt>결제 수단</dt><dd>${esc(order.payments?.[0]?.method || "-")}</dd>
        </dl>
        ${Auth.user ? "" : `<p class="test-notice" style="text-align:left">비회원 주문은 마이페이지에서 볼 수 없어요. 주문번호를 따로 보관해 주세요.</p>`}
        <div class="btn-row">
          <a class="btn" href="index.html">쇼핑 계속하기</a>
          ${Auth.user ? `<a class="btn btn--black" href="mypage.html">주문 내역 보기</a>` : `<a class="btn btn--black" href="signup.html">회원가입</a>`}
        </div>`;
    })();
  </script>
</body>
</html>
