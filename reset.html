<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 | MOOSIN STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="login">
  <header id="header"></header>

  <main class="inner">
    <section class="auth" id="auth"></section>
  </main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    /* 비밀번호 재설정 (F-209)
       1) 이메일 입력 → 재설정 메일 발송 (링크는 이 페이지로 돌아옴)
       2) 메일 링크로 들어오면 PASSWORD_RECOVERY 세션이 생기고, 새 비밀번호를 입력받아 저장 */
    (function () {
      const root = $("#auth");
      // supabase-js가 URL의 토큰을 처리하며 해시를 지우기 전에 먼저 확인
      let recovery = /type=recovery/.test(location.hash);

      function renderRequest() {
        root.innerHTML = `
          <h1>비밀번호 재설정</h1>
          <p>가입한 이메일로 비밀번호 재설정 링크를 보내 드려요.</p>
          <form id="reqForm" novalidate>
            <div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com"></div>
            <p class="form-msg" id="msg" role="alert"></p>
            <button type="submit" class="btn btn--black btn--block" id="submitBtn">재설정 메일 보내기</button>
          </form>
          <div class="auth__links"><a href="login.html">로그인으로 돌아가기</a></div>`;

        $("#reqForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = $("#email").value.trim();
          const msg = $("#msg");
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            msg.className = "form-msg";
            msg.textContent = "이메일 주소를 확인해 주세요.";
            return;
          }
          $("#submitBtn").disabled = true;
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL("reset.html", location.href).href });
          $("#submitBtn").disabled = false;
          if (error) {
            msg.className = "form-msg";
            msg.textContent = error.code === "over_email_send_rate_limit" ? "잠시 후 다시 시도해 주세요." : "메일을 보내지 못했어요. 잠시 후 다시 시도해 주세요.";
            return;
          }
          msg.className = "form-msg is-ok";
          msg.textContent = "메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 설정해 주세요.";
        });
      }

      function renderUpdate() {
        root.innerHTML = `
          <h1>새 비밀번호 설정</h1>
          <p>새로 사용할 비밀번호를 입력해 주세요.</p>
          <form id="updForm" novalidate>
            <div class="field"><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" placeholder="8자 이상"></div>
            <div class="field"><label for="password2">새 비밀번호 확인</label><input id="password2" type="password" autocomplete="new-password"></div>
            <p class="form-msg" id="msg" role="alert"></p>
            <button type="submit" class="btn btn--black btn--block" id="submitBtn">비밀번호 변경</button>
          </form>`;

        $("#updForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const msg = $("#msg");
          const pw = $("#password").value;
          msg.className = "form-msg";
          if (pw.length < 8) return (msg.textContent = "비밀번호는 8자 이상으로 입력해 주세요.");
          if (pw !== $("#password2").value) return (msg.textContent = "비밀번호가 서로 달라요.");
          $("#submitBtn").disabled = true;
          const { error } = await sb.auth.updateUser({ password: pw });
          $("#submitBtn").disabled = false;
          if (error) {
            msg.textContent = error.code === "same_password" ? "이전과 다른 비밀번호를 입력해 주세요." : "비밀번호를 바꾸지 못했어요. 링크가 만료됐다면 다시 요청해 주세요.";
            return;
          }
          toast("비밀번호를 바꿨어요");
          setTimeout(() => location.replace("index.html"), 800);
        });
      }

      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY" && !recovery) {
          recovery = true;
          renderUpdate();
        }
      });

      if (recovery) {
        root.innerHTML = `<p class="loading">링크를 확인하는 중...</p>`;
        // 토큰이 잘못됐거나 만료됐으면 세션이 생기지 않음
        Auth.ready.then(() => (Auth.user ? renderUpdate() : (renderRequest(), ($("#msg").textContent = "링크가 만료됐어요. 다시 요청해 주세요."))));
      } else {
        renderRequest();
      }
    })();
  </script>
</body>
</html>
